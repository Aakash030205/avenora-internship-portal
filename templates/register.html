{% extends 'base.html' %}{% block title %}Register | Avenora{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><span class="eyebrow">AVENORA LEARNING PORTAL</span><h1>Create your account</h1><p>After registration, choose one internship track from the available learning paths.</p><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Full name<input type="text" name="name" required maxlength="100" autocomplete="name"></label><label>Email<input type="email" name="email" required maxlength="150" autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="10" autocomplete="new-password"><small>Use at least 10 characters.</small></label><label>Confirm password<input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></label><button class="btn primary full" type="submit">Create Account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></section>{% endblock %}
